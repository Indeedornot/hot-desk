components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: PHPSESSID
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    User:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        email: &id022
          type: string
          format: email
        name: &id023
          type: string
        role: &id024
          type: string
          enum:
            - ROLE_USER
            - ROLE_ADMIN
        active: &id025
          type: boolean
    Office:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        name: &id010
          type: string
          maxLength: 100
        address: &id011
          type: string
          maxLength: 255
        timezone: &id012
          type: string
          example: Europe/Warsaw
        openingTime: &id013
          type: string
          example: 08:00
        closingTime: &id014
          type: string
          example: "18:00"
        active: &id015
          type: boolean
    Desk:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        officeId: &id016
          type: integer
          minimum: 1
        officeName:
          type: string
        label: &id017
          type: string
          maxLength: 40
        equipment: &id018
          type: string
          maxLength: 255
        x: &id019
          type: integer
          minimum: 0
          maximum: 9
        y: &id020
          type: integer
          minimum: 0
          maximum: 9
        active: &id021
          type: boolean
    Assignment:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        userId:
          type: integer
          minimum: 1
        userName:
          type: string
        deskId:
          type: integer
          minimum: 1
        deskLabel:
          type: string
        officeName:
          type: string
        createdAt:
          type: string
          format: date-time
    Booking:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        userId:
          type: integer
          minimum: 1
        userName:
          type: string
        deskId:
          type: integer
          minimum: 1
        deskLabel:
          type: string
        officeId:
          type: integer
          minimum: 1
        officeName:
          type: string
        timezone:
          type: string
        date:
          type: string
          format: date
        status:
          type: string
          enum:
            - BOOKED
            - CHECKED_IN
            - CHECKED_OUT
            - CANCELLED
        elapsed:
          type: boolean
        createdAt:
          type: string
          format: date-time
          nullable: false
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        checkedInAt:
          type: string
          format: date-time
          nullable: true
        checkedOutAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        actorId:
          type: integer
          minimum: 1
        actorName:
          type: string
        event_name:
          type: string
          example: booking.checked_in
        event_date:
          type: string
          format: date-time
        event_type:
          type: string
          enum:
            - booking
            - attendance
            - administration
        event_data:
          type: object
          additionalProperties: true
          example:
            bookingId: 12
            userId: 2
            deskId: 4
            date: "2026-11-12"
            status: CHECKED_IN
            source: manual
            eventId: c5fe1fa7d641ed91ed7fc3ab216048c3
    OfficeInput:
      type: object
      properties:
        name: *id010
        address: *id011
        timezone: *id012
        openingTime: *id013
        closingTime: *id014
        active: *id015
      required:
        - name
        - address
    DeskInput:
      type: object
      properties:
        officeId: *id016
        label: *id017
        equipment: *id018
        x: *id019
        y: *id020
        active: *id021
      required:
        - officeId
        - label
    UserInput:
      type: object
      properties:
        email: *id022
        name: *id023
        role: *id024
        active: *id025
        password:
          type: string
          minLength: 10
          maxLength: 128
          nullable: true
          description: Required for creation. Null on edit keeps the existing password.
      required:
        - email
        - name
    BookingInput:
      type: object
      properties:
        deskId:
          type: integer
          minimum: 1
        date:
          type: string
          format: date
          description: Today or tomorrow in the office timezone.
      required:
        - deskId
        - date
    AssignmentInput:
      type: object
      properties:
        deskId:
          type: integer
          minimum: 1
        userId:
          type: integer
          minimum: 1
      required:
        - deskId
        - userId
    AvailableDesk:
      allOf:
        - $ref: "#/components/schemas/Desk"
        - type: object
          properties:
            available:
              type: boolean
            state:
              type: string
              enum:
                - available
                - assigned
                - reserved
                - occupied
            reason:
              type: string
              nullable: true
            isAssignedToMe:
              type: boolean
            myBookingId:
              type: integer
              nullable: true
  responses:
    Error400:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error401:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error403:
      description: Permission or CSRF denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error404:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error409:
      description: Business rule or data conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error422:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error500:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error429:
      description: Too many login attempts
