openapi: 3.0.3
info:
  title: Hot Desk API
  version: 1.0.0
  description:
    Whole-day office reservations, permanent desks and attendance history. All /admin operations
    require ROLE_ADMIN. Other protected operations require ROLE_USER. Reservations are dated in the office
    timezone; audit timestamps include UTC offsets. Mutations require a session-bound CSRF token.
servers:
  - url: /api
security:
  - sessionAuth: []
paths:
  /auth/csrf:
    get:
      summary: Get a CSRF token
      tags:
        - Authentication
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      security: []
  /auth/login:
    post:
      summary: Sign in
      tags:
        - Authentication
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  csrfToken:
                    type: string
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
        "429":
          $ref: "#/components/responses/Error429"
      description:
        Sets the HttpOnly session cookie. Five failed login attempts per minute are allowed;
        throttled attempts return 429.
      security: []
      parameters:
        - &id001
          name: X-CSRF-TOKEN
          in: header
          required: true
          description: Get the token from GET /auth/csrf, or the successful login response.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
                - email
                - password
  /auth/me:
    get:
      summary: Get the signed-in account
      tags:
        - Authentication
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  csrfToken:
                    type: string
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
  /auth/logout:
    post:
      summary: Sign out and invalidate the session
      tags:
        - Authentication
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - *id001
  /offices:
    get:
      summary: List active offices
      tags:
        - Workspace
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Office"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
  /desks:
    get:
      summary: Get desk availability for today or tomorrow
      tags:
        - Workspace
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AvailableDesk"
                  assignedSeat:
                    allOf:
                      - $ref: "#/components/schemas/Assignment"
                    nullable: true
                  office:
                    $ref: "#/components/schemas/Office"
                  date:
                    type: string
                    format: date
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      description:
        Permanent assignments and existing reservations affect whether the current user may
        reserve a desk. Reserved/occupied desks remain visible.
      parameters:
        - name: officeId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: q
          in: query
          required: false
          schema:
            type: string
  /bookings:
    get:
      summary: List your reservations
      tags:
        - Workspace
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Booking"
                  total:
                    type: integer
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - &id002
          name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - &id003
          name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - &id004
          name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - &id005
          name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - BOOKED
              - CHECKED_IN
              - CHECKED_OUT
              - CANCELLED
        - &id006
          name: officeId
          in: query
          required: false
          schema:
            type: integer
    post:
      summary: Reserve a desk
      tags:
        - Workspace
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      description:
        Creates a whole-day reservation, an audit event and a queued email in one transaction.
        Permanent assignments are enforced.
      parameters:
        - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
  /bookings/{id}:
    put:
      summary: Change an upcoming reservation
      tags:
        - Workspace
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      description:
        The owner or an administrator may edit a BOOKED reservation before it ends. All reservation
        rules are checked again.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
  /bookings/{id}/cancel:
    post:
      summary: Cancel a BOOKED reservation and release the desk.
      tags:
        - Workspace
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      description:
        Only the owner or an administrator may perform this action. The audit records the actual
        actor and the reservation owner separately. Invalid repeated transitions return 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - *id001
  /bookings/{id}/check-in:
    post:
      summary: Check in to a BOOKED reservation on its day during office hours.
      tags:
        - Workspace
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      description:
        Only the owner or an administrator may perform this action. The audit records the actual
        actor and the reservation owner separately. Invalid repeated transitions return 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - *id001
  /bookings/{id}/check-out:
    post:
      summary: Check out of a CHECKED_IN reservation and release the desk for the remaining day.
      tags:
        - Workspace
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      description:
        Only the owner or an administrator may perform this action. The audit records the actual
        actor and the reservation owner separately. Invalid repeated transitions return 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - *id001
  /events:
    get:
      summary: List your reservation and assignment events
      tags:
        - Workspace
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  total:
                    type: integer
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - *id002
        - *id003
        - &id007
          name: event_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - booking
              - attendance
              - administration
        - &id008
          name: event_name
          in: query
          required: false
          schema:
            type: string
        - &id009
          name: bookingId
          in: query
          required: false
          schema:
            type: integer
  /admin/offices:
    get:
      summary: List offices
      tags:
        - Administration
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Office"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
    post:
      summary: Create office
      tags:
        - Administration
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Office"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeInput"
  /admin/offices/{id}:
    put:
      summary: Update office
      tags:
        - Administration
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Office"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeInput"
    delete:
      summary: Delete unused office
      tags:
        - Administration
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      description:
        Dependent records prevent deletion with 409. Deactivate a resource through its update
        endpoint when its history must be preserved. Resolve active bookings and assignments first. The
        final active administrator is protected.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - *id001
  /admin/desks:
    get:
      summary: List desks
      tags:
        - Administration
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Desk"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
    post:
      summary: Create desk
      tags:
        - Administration
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Desk"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeskInput"
  /admin/desks/{id}:
    put:
      summary: Update desk
      tags:
        - Administration
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Desk"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeskInput"
    delete:
      summary: Delete unused desk
      tags:
        - Administration
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      description:
        Dependent records prevent deletion with 409. Deactivate a resource through its update
        endpoint when its history must be preserved. Resolve active bookings and assignments first. The
        final active administrator is protected.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - *id001
  /admin/users:
    get:
      summary: List users
      tags:
        - Administration
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  total:
                    type: integer
                  page:
                    type: integer
                    minimum: 1
                  pageSize:
                    type: integer
                    minimum: 1
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - *id002
        - *id003
        - name: q
          in: query
          required: false
          schema:
            type: string
    post:
      summary: Create user
      tags:
        - Administration
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
  /admin/users/{id}:
    put:
      summary: Update user
      tags:
        - Administration
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "500":
          $ref: "#/components/responses/Error500"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
    delete:
