<form class="admin-form" (ngSubmit)="save()">
  <label>
    Full name
    <input name="name" [(ngModel)]="draft.name" required maxlength="100" />
  </label>
  <label>
    Email
    <input name="email" type="email" [(ngModel)]="draft.email" required maxlength="180" />
  </label>
  <label>
    {{ editing ? 'New password (leave blank to keep)' : 'Initial password' }}
    <input
      name="password"
      type="password"
      [(ngModel)]="draft.password"
      [required]="!editing"
      minlength="10"
      maxlength="128"
      autocomplete="new-password"
    />
  </label>
  <label>
    Role
    <select name="role" [(ngModel)]="draft.role">
      <option value="ROLE_USER">Team member</option>
      <option value="ROLE_ADMIN">Administrator</option>
    </select>
  </label>
  <label class="checkbox-label">
    <input type="checkbox" name="active" [(ngModel)]="draft.active" />
    Active account
  </label>
  <ng-content />
</form>
