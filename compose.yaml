name: hot-desk-standalone

x-app: &app
  image: hot-desk-app:local
  environment:
    APP_ENV: dev
    APP_DEBUG: '0'
    APP_SECRET: ${HOT_DESK_APP_SECRET:?Set HOT_DESK_APP_SECRET in the Compose env file}
    DATABASE_URL: "postgresql://hotdesk:${HOT_DESK_DB_PASSWORD:?Set HOT_DESK_DB_PASSWORD in the Compose env file}@postgres:5432/hotdesk?serverVersion=18&charset=utf8"
    MAILER_DSN: smtp://mailpit:1025

services:
  backend:
    <<: *app
    build: .
    ports:
      - "127.0.0.1:${HOT_DESK_PORT:-8080}:80"
    volumes:
      - demo_accounts:/app/.local
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1/]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      init:
        condition: service_completed_successfully

  init:
    <<: *app
    pull_policy: never
    entrypoint: [sh, -ec]
    command: ['php bin/console doctrine:migrations:migrate --no-interaction && php bin/console app:setup']
    volumes:
      - demo_accounts:/app/.local
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *app
    pull_policy: never
    entrypoint: [php, bin/console, messenger:consume, async, '--memory-limit=128M', '--time-limit=3600']
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: hotdesk
      POSTGRES_USER: hotdesk
      POSTGRES_PASSWORD: ${HOT_DESK_DB_PASSWORD:?Set HOT_DESK_DB_PASSWORD in the Compose env file}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U hotdesk -d hotdesk']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:${HOT_DESK_MAIL_PORT:-8025}:8025"

volumes:
  postgres_data:
  demo_accounts:
