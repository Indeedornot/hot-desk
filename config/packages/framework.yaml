framework:
  secret: "%env(APP_SECRET)%"
  csrf_protection: true
  session:
    cookie_httponly: true
    cookie_samesite: lax
    cookie_secure: auto
  serializer:
    default_context:
      allow_extra_attributes: false
  validation:
    email_validation_mode: html5

when@test:
  framework:
    test: true
    session:
      storage_factory_id: session.storage.factory.mock_file
