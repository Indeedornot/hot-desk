security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email
  firewalls:
    dev:
      pattern: ^/(_profiler|_wdt|assets)/
      security: false
    main:
      lazy: true
      provider: app_user_provider
      user_checker: App\Security\ActiveUserChecker
      entry_point: App\Security\JsonEntryPoint
      json_login:
        check_path: /api/auth/login
        username_path: email
        password_path: password
        failure_handler: App\Security\LoginFailureHandler
      login_throttling:
        max_attempts: 5
        interval: "1 minute"
  role_hierarchy:
    ROLE_ADMIN: ROLE_USER
  access_control:
    - { path: ^/api/auth/(csrf|login)$, roles: PUBLIC_ACCESS }
    - { path: ^/api/admin, roles: ROLE_ADMIN }
    - { path: ^/api, roles: ROLE_USER }
when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10
