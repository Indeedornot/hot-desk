framework:
  messenger:
    failure_transport: failed
    transports:
      async:
        dsn: "%env(MESSENGER_TRANSPORT_DSN)%"
        retry_strategy:
          max_retries: 3
          delay: 1000
      failed:
        dsn: "doctrine://default?queue_name=failed&auto_setup=0"
    routing:
      App\Message\BookingNotification: async
